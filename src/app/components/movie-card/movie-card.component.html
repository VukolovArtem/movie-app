<div class="card">
  <div class="card__image">
    <a (click)="navigateToMovieDetails()" (keydown)="navigateToMovieDetails()">
      <img alt="{{ movie.title }}" [src]="imageUrl"
    /></a>
  </div>

  <div class="card__content">
    <h2 class="card__title">{{ movie.original_title | uppercase }}</h2>
    <h3 class="card__release">{{ movie.release_date | dateFormat }}</h3>
    @if(isDetail){
    <p class="card__descr">
      {{ movie.overview }}
    </p>
    }
  </div>

  <div class="card__active">
    <p-rating
      class="rating"
      [(ngModel)]="rating"
      [readonly]="true"
      [cancel]="false"
      [stars]="5"
    />

    <p-button
      class="button"
      icon="pi pi-heart br-20"
      size="large"
      (click)="addToFavoritesList()"
    />
    <p-button
      class="button"
      icon="pi pi-trash br-20"
      size="large"
      (click)="removeToFavoritesList()"
    />
    <p-button
      class="button"
      icon="pi pi-bookmark"
      size="large"
      (click)="addToWatchLetterList()"
    />
  </div>
</div>
